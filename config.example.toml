# Example city config — copy into a per-city checkout as config.toml and run
# the engine against it: `python run.py --city-dir <that checkout>`. Values
# below are Toronto's real ones, kept as a worked example. See
# future-work/multi-city/02-city-config-contract.md for the contract.

[city]
# Which city this checkout imports. `slug` names the per-city files under
# [osm] extract_dir (`<slug>-addresses.json`); `name` is what appears in
# human-readable strings. Both are required — there is deliberately no
# default, so a config that predates multi-city fails loudly instead of
# silently importing Toronto.
slug = "toronto"
name = "Toronto"
# Optional polygon layer the tile builder subdivides, so operators pick run
# areas by a name they recognise. Leave empty for a city with no such layer:
# the quadtree then splits `[osm] city_bbox` directly and names the tiles after
# `name` above. Toronto's is the City's official 158-neighbourhood layer.
neighbourhoods_url = "https://ckan0.cf.opendata.inter.prod-toronto.ca/dataset/fc443770-ef0a-4025-9c2c-2cb558bfab00/resource/0719053b-28b7-48ea-b863-068823a93aaa/download/neighbourhoods-4326.geojson"

[source]
sqlite_path = "C:/Users/kk/Code/ontario-address-changes/data/toronto/toronto.db"

# Where each logical field lives in this city's tracker DB — the per-city
# projection recipe (multi-city Tier 2). The tracker's canonical columns are
# not dependable across cities (18 of 42 datasets store the street *name
# component* only), so street/full resolution is declared per city, and each
# optional key below is a capability: leave it out and the engine projects
# NULL for it and visibly disables every feature that reads it, instead of
# running those features silently against nothing (see
# future-work/multi-city/03-capability-gating.md).
[source_fields]
# "street" | "full" | "props:<KEY>". Toronto's canonical street is
# linear_name_full — typed on 99% of rows — so the column is usable directly.
street_from = "street"
# "full" (the tracker's combined column) | "number+street" (synthesized, for
# sources that publish no combined address — e.g. Hamilton).
full_from = "full"
# Optional capabilities, each "props:<KEY>". Absent key = absent capability.
municipality = "props:MUNICIPALITY_NAME"   # cross-municipality dedup keying
ward = "props:WARD_NAME"
lo_num = "props:LO_NUM"                    # address ranges: suffix_range check,
lo_num_suf = "props:LO_NUM_SUF"            # range coverage + safety gate
hi_num = "props:HI_NUM"
hi_num_suf = "props:HI_NUM_SUF"
address_class = "props:ADDRESS_CLASS_DESC" # Land Entrance skip + Land dedup
# unit = "unit" | "props:<KEY>" — declare when the source publishes one row
# per unit (Toronto doesn't). Declaring it REQUIRES a [units] policy; see
# future-work/multi-city/09-units.md.

# Required iff [source_fields] declares `unit`. The only policy so far is
# "collapse-to-civic": one candidate per (number, street, municipality), the
# unit-less row elected representative — units recorded as an explicit
# deferral, never a silent drop (09-units.md option 2).
# [units]
# policy = "collapse-to-civic"

# Streets where this city's source and OSM disagree on the actual name — not on
# how to abbreviate it, which the normalizer already handles. Two shapes show up
# in practice: proper-noun spacing the normalizer cannot bridge (source "Deane
# Field Cres" vs OSM "Deanefield Crescent"), and outright suffix corrections
# where the source has the street type wrong (source "Kathleen Ave" sits on what
# OSM and signage call "Kathleen Crescent").
#
# Applied at ingest, so the candidate's street_raw and street_norm — and
# therefore both conflation matching and the uploaded addr:street tag — carry
# the OSM name local mappers already know. Values keep the source's short
# suffixes; expansion runs after the override and rewrites those to the OSM
# full form. Lookup is case- and whitespace-insensitive. An entry that does not
# change the normalized form is refused at load, since the normalizer already
# covers it. Each entry is a candidate for retirement once the source and OSM
# converge; the `nearby_street_mismatch` review check surfaces fresh ones.
#
# Omit the whole section for a city with no such disagreements (Guelph,
# Hamilton) — the engine then leaves every street name exactly as written.
[streets.overrides]
"Deane Field Cres" = "Deanefield Cres"
"Golfcrest Rd" = "Golf Crest Rd"
"Forest View Rd" = "Forestview Rd"
"Greenhouse Rd" = "Green House Rd"
"Kathleen Ave" = "Kathleen Cres"
"Meadow Crest Rd" = "Meadowcrest Rd"
"Posthorn Grv" = "Post Horn Grv"
"Scenic Millway" = "Scenic Mill Way"
"Mac Gregor Ave" = "MacGregor Ave"
"Governor's Rd" = "Governors Road"
"St Andrews Gdns" = "St. Andrew's Gardens"
"St Leonard's Ave" = "Saint Leonard's Avenue"
# OSM's canonical name carries no street-type suffix at all (way/27371860
# name="Sunny Slope", alt_name="Sunnyslope Avenue"); the existing OSM building
# addresses use addr:street="Sunny Slope". This is the one entry whose value
# intentionally has no short suffix — don't "fix" it by appending one.
"Sunnyslope Ave" = "Sunny Slope"

# Operator-facing chrome — where the tool's own header and footer point for
# this city. Everything is optional: omit the section and the pages fall back
# to the engine's own repo and licence and show no city credit, rather than
# another city's (before 2026-08-29 the chrome was Toronto's for every city).
#
# SCAFFOLDING A NEW CITY: replace every value below or delete the whole
# section. Unlike [city] slug/name, nothing here fails loudly on a stale copy —
# a config that keeps these lines silently shows your operator Toronto's repo,
# Toronto's forum thread and Toronto's licence, which is exactly the bug this
# section was added to fix. Declare only links that exist; an omitted key is
# hidden, and an unannounced city having no forum link is correct.
[links]
# This city checkout's repo. Footer "GitHub", and the static export's "Run the
# live tool" link.
repo = "https://github.com/skfd/toronto-2-address-import"
# The OSM community thread where this import is discussed. Omit until the city
# has actually announced — the link is hidden rather than pointing nowhere.
discussion = "https://community.openstreetmap.org/t/address-import-for-toronto/119368"
# The import proposal or evidence document this checkout publishes. The static
# export's banner describes the snapshot as evidence for it.
proposal = "https://github.com/skfd/toronto-2-address-import/blob/main/IMPORT_PROPOSAL.mediawiki"
# The source's open-data licence, credited in the footer beside OSM's. Both
# keys or neither. Distinct from [export] source_license, which is the SPDX id
# written onto the changeset; this is a name and a URL for a human to click.
open_data = { name = "Toronto Open Data", url = "https://open.toronto.ca/open-data-licence/" }

[run_defaults]
# Small downtown rectangle for first test run
bbox = [43.645, -79.42, 43.665, -79.39]
overpass_url = "https://overpass-api.de/api/interpreter"

[osm]
# Where stage 2 reads OSM data from. "local" reads the cached extract refreshed
# via `python -m t2.osm_refresh`. "overpass" posts a live query to overpass_url.
source = "local"
# Geofabrik PBF covering the city. Ontario is the smallest Geofabrik region
# that includes Toronto, and it covers every other city in the portfolio too,
# so this line does not change per city; ~600MB on first download, diff-friendly.
pbf_url = "https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf"
# City-ish clip applied after tag filtering. Anything outside this rectangle is
# discarded from the local extract to keep it small. Required — a rectangle is
# not a boundary (see future-work/multi-city/10-boundary-clipping.md).
city_bbox = [43.58, -79.64, 43.86, -79.11]
# Where the PBF, filtered JSON, meta sidecar, lock and log live.
extract_dir = "data/osm"

[conflation]
# Search radius for finding a matching OSM address (same housenumber + street).
match_radius_m = 100
# Matches within this distance auto-approve; beyond it they become MATCH_FAR and go to review.
match_near_m = 15

[checks]
match_far = true
suffix_range = true
city_duplicate = true
missing_sample = true
nearby_street_mismatch = true

[check_params.city_duplicate]
radius_m = 3.0

[check_params.missing_sample]
every_nth = 50

[check_params.nearby_street_mismatch]
# Distance from a MISSING candidate within which an OSM address with the
# same housenumber but a different normalized street name will be flagged
# as a likely street-name spelling variant (e.g. "Deane Field" vs
# "Deanefield"). Tight by design — a wider radius would surface unrelated
# same-number addresses on parallel streets.
radius_m = 20.0

[check_params.match_number_drift]
# A different-numbered OSM address on the same street must be at least this
# many metres closer to the candidate than the matched element before the
# match is flagged as positionally drifted. Small by design: OSM node
# placement noise is comparable to a one-house drift gap on dense blocks,
# so a wider slack would miss most genuine drift.
slack_m = 2.0

[upload]
changesets_per_minute = 1
# {city} is [city].name, {run_name} the run's own name.
changeset_comment_template = "{city} Open Data address import, run={run_name}"

[export]
# Goes into `source` on every uploaded node and on the changeset itself.
attribution = "City of Toronto Open Data"
# Changeset `import_plan` tag — the wiki page documenting this city's import.
import_plan = "https://wiki.openstreetmap.org/wiki/Toronto/Import/AddressPoints"
# Constant tags written on every created node, on top of the derived
# addr:housenumber / addr:street / addr:postcode / addr:source. Declare only
# what this city's published tagging plan promises; omit the key entirely
# where it promises nothing (Toronto writes no addr:city, deliberately).
# Redefining a derived tag is refused at load.
# node_tags = { "addr:city" = "Guelph" }
# Changeset `source:license` tag. Declare it only where this city's published
# changeset-tag table names a licence — Toronto's does not.
# source_license = "OGL-Canada-2.0"

# Optional. Presentation for the wrap-up one-pager at /stats, exported with
# `python -m t2.static_export --stats`. Omit the whole section and the page
# renders in the engine's neutral palette (the operator animation's own legend
# colours) with a "<city> · Open Data · OSM" badge — nothing here is required.
# [stats]
# accent = "#DA291C"                    # headline accent
# accent_2 = "#FFCD32"                  # peaks, hero number
# accent_3 = "#00923F"                  # positive / complete
# badge = "Toronto · Open Data · OSM"   # small uppercase line above the title
# The gap after which the page decides the operator got up from the desk, and
# a new work session began. Only affects the "hands-on time" chart. There is no
# clock in the schema, so this threshold *is* the definition of hands-on time;
# 30 minutes is the default and reproduces Toronto's published 25 sessions.
# session_gap_minutes = 30
