{# When sent out-of-band behind a <tr>, the fragment is parsed inside a
   synthetic table by htmx 1.x and a bare <div> would be foster-parented out
   of it; <template> is the documented way to keep it whole. The review queue
   swaps a <div>, which needs no such wrapper.
   The tile links keep the OSM filter, sort and mode: a tile narrows the
   queue, it does not leave it. #}
{% set in_table = oob and not (view and view.mode == 'queue') %}
{% set keep %}{% if view %}{% if view.osm %}&osm={{ view.osm }}{% endif %}{% if view.sort %}&sort={{ view.sort }}{% endif %}{% if view.mode %}&mode={{ view.mode }}{% endif %}{% endif %}{% endset %}
{% if in_table %}<template>{% endif %}
<div id="shape-tiles" {% if oob %}hx-swap-oob="true"{% endif %}>
<div class="tiles">
  <a class="tile {% if not active_shape %}on{% endif %}" href="/units/shapes?{{ keep[1:] }}">
    <div class="n">{% if view_counts %}{{ view_counts.values() | sum }}<span class="of"> of {{ data.group_total }}</span>{% else %}{{ data.group_total }}{% endif %}</div>
    <div class="k">All groups</div>
    <div class="d">{{ '{:,}'.format(data.unit_total) }} units</div>
  </a>
  {% for shape, blurb in shapes %}
  <a class="tile tile-{{ shape }} {% if active_shape == shape %}on{% endif %}"
     href="/units/shapes?shape={{ shape }}{{ keep }}">
    <div class="n">{% if view_counts %}{{ view_counts[shape] }}<span class="of"> of {{ data.counts[shape] }}</span>{% else %}{{ data.counts[shape] }}{% endif %}</div>
    <div class="k">{{ shape }}</div>
    <div class="d">{{ blurb }}</div>
  </a>
  {% endfor %}
</div>

<p class="muted" style="font-size:.84rem">
  Together these create <strong>{{ '{:,}'.format(data.nodes_created) }} nodes</strong>,
  {{ '{:,}'.format(data.door_nodes) }} of them doors.
  {% if data.overridden %}<strong>{{ data.overridden }}</strong> group{{ 's' if data.overridden != 1 }} decided{% if data.auto %} ({{ data.auto }} by the auto-judge){% endif %}{% if data.stale %}, {{ data.stale }} of the saved verdicts stale{% endif %}.{% endif %}
  {% if data.in_osm %}{{ data.in_osm }} already have doors or a listing in OSM; a verdict there adds only what is missing.{% endif %}
  {% if data.frozen %}{{ data.frozen }} uploaded by this import and frozen.{% endif %}
  A further {{ '{:,}'.format(data.no_unit_groups) }} civic groups hold no unit rows at
  all — several rows sharing one address is an intra-source duplicate, not a unit
  question, so they are counted here and reviewed elsewhere.
</p>
</div>
{% if in_table %}</template>{% endif %}
